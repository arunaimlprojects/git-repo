name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.19'

    # 3️⃣ Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4️⃣ Run tests
    - name: Run tests
      run: pytest

    # 5️⃣ Login to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 6️⃣ Build Docker image with tags
    - name: Build Docker image
      run: |
        IMAGE_NAME=arunkumar253/myfastapi-mlops
        TAG=latest
        docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:${GITHUB_SHA::8} .

    # 7️⃣ Push Docker image
    - name: Push Docker image
      run: |
        IMAGE_NAME=arunkumar253/myfastapi-mlops
        TAG=latest
        docker push $IMAGE_NAME:$TAG
        docker push $IMAGE_NAME:${GITHUB_SHA::8}
