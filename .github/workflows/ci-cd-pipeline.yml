name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.19'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest          # <<-- yaha add karo

    - name: Run tests
      run: python -m pytest         # <<-- python -m use karna better hai

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        IMAGE_NAME=arunkumar253/myfastapi-mlops
        TAG=latest
        docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:${GITHUB_SHA::8} .

    - name: Push Docker image
      run: |
        IMAGE_NAME=arunkumar253/myfastapi-mlops
        TAG=latest
        docker push $IMAGE_NAME:$TAG
        docker push $IMAGE_NAME:${GITHUB_SHA::8}
